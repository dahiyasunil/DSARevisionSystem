<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Revision Tracker</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --border: #dfe3e8;
    --text: #1a1d21;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --accent-2: #6366f1;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --warn: #d97706;
    --warn-bg: #fef3c7;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 6px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1e2126;
      --surface-2: #262a31;
      --border: #33383f;
      --text: #e8eaed;
      --text-muted: #9aa1ab;
      --accent: #818cf8;
      --accent-2: #a5b4fc;
      --danger: #f87171;
      --danger-bg: #3f1d1d;
      --success: #4ade80;
      --success-bg: #163722;
      --warn: #fbbf24;
      --warn-bg: #3a2c0f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 8px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  .subtitle { color: var(--text-muted); font-size: .85rem; margin-top: 2px; }
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 16px; min-width: 100px; box-shadow: var(--shadow);
  }
  .stat-card .num { font-size: 1.4rem; font-weight: 700; }
  .stat-card .label { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
  nav.tabs {
    display: flex; gap: 4px; background: var(--surface-2); border-radius: var(--radius);
    padding: 4px; margin-bottom: 20px; flex-wrap: wrap;
  }
  nav.tabs button {
    flex: 1; min-width: 100px; padding: 8px 12px; border: none; background: transparent;
    color: var(--text-muted); font-size: .88rem; font-weight: 600; border-radius: 8px;
    cursor: pointer; transition: background .15s, color .15s;
  }
  nav.tabs button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  section.view { display: none; }
  section.view.active { display: block; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 16px; }
  .empty .big { font-size: 2rem; margin-bottom: 8px; }
  .problem-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .problem-title { font-weight: 700; font-size: 1.02rem; }
  .problem-title a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .badge {
    font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted); text-transform: uppercase; letter-spacing: .02em;
  }
  .badge.diff-Easy { background: var(--success-bg); color: var(--success); }
  .badge.diff-Medium { background: var(--warn-bg); color: var(--warn); }
  .badge.diff-Hard { background: var(--danger-bg); color: var(--danger); }
  .badge.stage { background: var(--surface-2); color: var(--accent); }
  .meta-line { font-size: .78rem; color: var(--text-muted); margin-top: 8px; }
  details.notes { margin-top: 10px; }
  details.notes summary {
    cursor: pointer; font-size: .82rem; color: var(--accent); font-weight: 600; user-select: none;
  }
  details.notes .content { margin-top: 8px; font-size: .87rem; line-height: 1.5; white-space: pre-wrap; }
  .notes-block { margin-top: 4px; }
  .notes-block .k { font-size: .72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: .03em; }
  .edit-block { margin-top: 10px; }
  .edit-block .field { margin-bottom: 10px; }
  .edit-block label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
  .edit-block textarea {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: .87rem;
    min-height: 70px; resize: vertical;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); padding: 8px 14px; transition: opacity .12s, transform .06s;
  }
  button:hover { opacity: .85; }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.success { background: var(--success-bg); color: var(--success); border-color: transparent; }
  button.danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  button.ghost { background: transparent; }
  button.small { padding: 5px 10px; font-size: .76rem; }
  form .field { margin-bottom: 14px; }
  form label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
  form input, form select, form textarea {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: .9rem;
  }
  form textarea { min-height: 70px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters input, .filters select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: .85rem;
  }
  .filters input { flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; }
  tr:hover td { background: var(--surface-2); }
  .footer-actions { display: flex; gap: 8px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .82rem; }
  .bar-row .label { width: 110px; flex-shrink: 0; color: var(--text-muted); }
  .bar-track { flex: 1; background: var(--surface-2); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-row .count { width: 30px; text-align: right; color: var(--text-muted); }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
    font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: .95; }
  a.file-btn { display: inline-block; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>DSA Revision Tracker</h1>
      <div class="subtitle">Spaced repetition for algorithm problems &mdash; re-solve, don't just recognize.</div>
    </div>
  </header>

  <div class="stat-row" id="statRow"></div>

  <nav class="tabs">
    <button data-view="due" class="active">Due Today</button>
    <button data-view="add">Add Problem</button>
    <button data-view="all">All Problems</button>
    <button data-view="stats">Stats</button>
  </nav>

  <section id="view-due" class="view active"></section>

  <section id="view-add" class="view">
    <div class="card">
      <form id="addForm">
        <div class="field">
          <label>Title *</label>
          <input type="text" id="f-title" placeholder="e.g. Longest Substring Without Repeating Characters" required>
        </div>
        <div class="row2">
          <div class="field">
            <label>Link (optional)</label>
            <input type="url" id="f-link" placeholder="https://leetcode.com/problems/...">
          </div>
          <div class="field">
            <label>Pattern / Tag *</label>
            <input type="text" id="f-pattern" placeholder="e.g. Sliding Window" required>
          </div>
        </div>
        <div class="field">
          <label>Difficulty</label>
          <select id="f-difficulty">
            <option>Easy</option>
            <option selected>Medium</option>
            <option>Hard</option>
          </select>
        </div>
        <div class="field">
          <label>Approach / Notes</label>
          <textarea id="f-notes" placeholder="Key idea, technique, complexity..."></textarea>
        </div>
        <div class="field">
          <label>Common Mistake (what tripped you up)</label>
          <textarea id="f-mistake" placeholder="e.g. forgot to shrink window when char count exceeds limit"></textarea>
        </div>
        <button type="submit" class="primary">Add Problem</button>
      </form>
    </div>
  </section>

  <section id="view-all" class="view">
    <div class="filters">
      <input type="text" id="searchBox" placeholder="Search by title...">
      <select id="filterPattern"><option value="">All patterns</option></select>
      <select id="filterDifficulty">
        <option value="">All difficulties</option>
        <option>Easy</option><option>Medium</option><option>Hard</option>
      </select>
    </div>
    <div id="allList"></div>
  </section>

  <section id="view-stats" class="view">
    <div class="card" id="statsCard"></div>
  </section>

  <div class="footer-actions">
    <button id="exportBtn" class="ghost small">Export backup (JSON)</button>
    <label class="file-btn">
      <input type="file" id="importInput" accept="application/json" style="display:none">
      <button type="button" class="ghost small" onclick="document.getElementById('importInput').click()">Import backup</button>
    </label>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'dsaRevisionData_v1';
const LADDER = [1, 3, 7, 14, 30]; // days

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { problems: [] };
  } catch (e) { return { problems: [] }; }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function daysUntil(dateStr) {
  const a = new Date(todayStr() + 'T00:00:00');
  const b = new Date(dateStr + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function uid() { return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 1800);
}

let state = loadData();
let editingId = null;

function newProblem({title, link, pattern, difficulty, notes, mistake}) {
  const now = todayStr();
  return {
    id: uid(),
    title, link, pattern, difficulty,
    notes: notes || '', mistake: mistake || '',
    stage: 0,
    nextDue: now,
    lastReviewed: null,
    createdAt: now,
    history: []
  };
}

function reviewProblem(id, passed) {
  const p = state.problems.find(x => x.id === id);
  if (!p) return;
  const now = todayStr();
  if (passed) {
    p.stage = Math.min(p.stage + 1, LADDER.length - 1);
  } else {
    p.stage = 0;
  }
  const interval = LADDER[p.stage];
  p.nextDue = addDays(now, interval);
  p.lastReviewed = now;
  p.history.push({ date: now, result: passed ? 'pass' : 'fail', intervalDays: interval });
  saveData();
  toast(passed ? `Nice — next review in ${interval} day${interval>1?'s':''}` : 'Reset — back to day 1 tomorrow');
  renderAll();
}

function deleteProblem(id) {
  if (!confirm('Delete this problem permanently?')) return;
  state.problems = state.problems.filter(x => x.id !== id);
  saveData();
  renderAll();
}

function startEdit(id) {
  editingId = id;
  renderAll();
}
function cancelEdit() {
  editingId = null;
  renderAll();
}
function saveEdit(btn, id) {
  const p = state.problems.find(x => x.id === id);
  if (!p) return;
  const card = btn.closest('.card');
  p.notes = card.querySelector('.edit-notes').value.trim();
  p.mistake = card.querySelector('.edit-mistake').value.trim();
  saveData();
  editingId = null;
  toast('Notes updated');
  renderAll();
}

// ---------- Rendering ----------

function renderStatRow() {
  const total = state.problems.length;
  const dueToday = state.problems.filter(p => daysUntil(p.nextDue) <= 0).length;
  const dueWeek = state.problems.filter(p => { const d = daysUntil(p.nextDue); return d > 0 && d <= 7; }).length;
  const mastered = state.problems.filter(p => p.stage === LADDER.length - 1).length;
  document.getElementById('statRow').innerHTML = `
    <div class="stat-card"><div class="num">${dueToday}</div><div class="label">Due today</div></div>
    <div class="stat-card"><div class="num">${dueWeek}</div><div class="label">Due this week</div></div>
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total problems</div></div>
    <div class="stat-card"><div class="num">${mastered}</div><div class="label">Mastered (30d+)</div></div>
  `;
}

function problemCard(p, { showDueBadge } = {}) {
  const overdueDays = -daysUntil(p.nextDue);
  const dueBadge = showDueBadge
    ? (overdueDays > 0 ? `<span class="badge" style="background:var(--danger-bg);color:var(--danger)">${overdueDays}d overdue</span>` : `<span class="badge" style="background:var(--success-bg);color:var(--success)">Due today</span>`)
    : `<span class="badge">Due ${p.nextDue}</span>`;
  return `
  <div class="card" data-id="${p.id}">
    <div class="problem-head">
      <div>
        <div class="problem-title">${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</div>
        <div class="badges">
          <span class="badge diff-${p.difficulty}">${p.difficulty}</span>
          <span class="badge">${esc(p.pattern)}</span>
          <span class="badge stage">Stage ${p.stage + 1}/${LADDER.length}</span>
          ${dueBadge}
        </div>
      </div>
    </div>
    ${editingId === p.id ? `
    <div class="edit-block">
      <div class="field">
        <label>Approach / Notes</label>
        <textarea class="edit-notes" placeholder="Key idea, technique, complexity...">${esc(p.notes)}</textarea>
      </div>
      <div class="field">
        <label>Common Mistake</label>
        <textarea class="edit-mistake" placeholder="e.g. forgot to shrink window when char count exceeds limit">${esc(p.mistake)}</textarea>
      </div>
    </div>
    ` : ((p.notes || p.mistake) ? `
    <details class="notes">
      <summary>Show approach &amp; notes</summary>
      <div class="content">
        ${p.notes ? `<div class="notes-block"><div class="k">Approach</div>${esc(p.notes)}</div>` : ''}
        ${p.mistake ? `<div class="notes-block" style="margin-top:8px"><div class="k">Watch out for</div>${esc(p.mistake)}</div>` : ''}
      </div>
    </details>` : '')}
    <div class="meta-line">Last reviewed: ${p.lastReviewed || 'never'} &middot; Added: ${p.createdAt}</div>
    <div class="actions">
      ${editingId === p.id ? `
        <button class="primary small" onclick="saveEdit(this, '${p.id}')">💾 Save notes</button>
        <button class="ghost small" onclick="cancelEdit()">Cancel</button>
      ` : `
        <button class="success" onclick="reviewProblem('${p.id}', true)">✅ Solved it</button>
        <button class="danger" onclick="reviewProblem('${p.id}', false)">❌ Struggled / failed</button>
        <button class="ghost small" onclick="startEdit('${p.id}')">✏️ Edit notes</button>
        <button class="ghost small" onclick="deleteProblem('${p.id}')">Delete</button>
      `}
    </div>
  </div>`;
}

function renderDue() {
  const due = state.problems
    .filter(p => daysUntil(p.nextDue) <= 0)
    .sort((a,b) => a.nextDue.localeCompare(b.nextDue));
  const el = document.getElementById('view-due');
  if (due.length === 0) {
    el.innerHTML = `<div class="empty"><div class="big">🎉</div>Nothing due today.<br>Add problems or come back tomorrow.</div>`;
    return;
  }
  el.innerHTML = due.map(p => problemCard(p, { showDueBadge: true })).join('');
}

function renderAll() {
  renderStatRow();
  renderDue();
  renderAllList();
  renderStats();
}

function renderAllList() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const patternFilter = document.getElementById('filterPattern').value;
  const diffFilter = document.getElementById('filterDifficulty').value;

  // populate pattern filter options
  const patterns = [...new Set(state.problems.map(p => p.pattern))].sort();
  const patSel = document.getElementById('filterPattern');
  const currentVal = patSel.value;
  patSel.innerHTML = `<option value="">All patterns</option>` + patterns.map(p => `<option ${p===currentVal?'selected':''}>${esc(p)}</option>`).join('');

  let list = state.problems.slice().sort((a,b) => a.nextDue.localeCompare(b.nextDue));
  if (search) list = list.filter(p => p.title.toLowerCase().includes(search));
  if (patternFilter) list = list.filter(p => p.pattern === patternFilter);
  if (diffFilter) list = list.filter(p => p.difficulty === diffFilter);

  const container = document.getElementById('allList');
  if (list.length === 0) {
    container.innerHTML = `<div class="empty">No problems match.</div>`;
    return;
  }
  container.innerHTML = list.map(p => problemCard(p)).join('');
}

function renderStats() {
  const total = state.problems.length;
  const byPattern = {};
  state.problems.forEach(p => { byPattern[p.pattern] = (byPattern[p.pattern] || 0) + 1; });
  const maxCount = Math.max(1, ...Object.values(byPattern));
  const rows = Object.entries(byPattern).sort((a,b) => b[1]-a[1]).map(([pat, count]) => `
    <div class="bar-row">
      <div class="label">${esc(pat)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/maxCount*100)}%"></div></div>
      <div class="count">${count}</div>
    </div>
  `).join('');

  const byStage = LADDER.map((days, i) => state.problems.filter(p => p.stage === i).length);
  const stageMax = Math.max(1, ...byStage);
  const stageRows = LADDER.map((days, i) => `
    <div class="bar-row">
      <div class="label">${days}d stage</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(byStage[i]/stageMax*100)}%"></div></div>
      <div class="count">${byStage[i]}</div>
    </div>
  `).join('');

  document.getElementById('statsCard').innerHTML = total === 0
    ? `<div class="empty">Add some problems to see stats.</div>`
    : `
    <h3 style="margin-top:0">By pattern</h3>
    ${rows}
    <h3>By revision stage</h3>
    ${stageRows}
  `;
}

// ---------- Events ----------

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'all') renderAllList();
    if (btn.dataset.view === 'stats') renderStats();
  });
});

document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const p = newProblem({
    title: document.getElementById('f-title').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    pattern: document.getElementById('f-pattern').value.trim(),
    difficulty: document.getElementById('f-difficulty').value,
    notes: document.getElementById('f-notes').value.trim(),
    mistake: document.getElementById('f-mistake').value.trim(),
  });
  state.problems.push(p);
  saveData();
  e.target.reset();
  document.getElementById('f-difficulty').value = 'Medium';
  toast('Problem added — due today for first review');
  renderAll();
  document.querySelector('nav.tabs button[data-view="due"]').click();
});

document.getElementById('searchBox').addEventListener('input', renderAllList);
document.getElementById('filterPattern').addEventListener('change', renderAllList);
document.getElementById('filterDifficulty').addEventListener('change', renderAllList);

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dsa-revision-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.problems || !Array.isArray(parsed.problems)) throw new Error('bad format');
      if (state.problems.length > 0 && !confirm('Import will replace your current data. Continue?')) return;
      state = parsed;
      saveData();
      renderAll();
      toast('Backup imported');
    } catch (err) {
      alert('Could not read that file as a valid backup.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

renderAll();
</script>
</body>
</html>
